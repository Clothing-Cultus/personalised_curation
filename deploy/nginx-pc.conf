# nginx site for the Personal Curation API. HTTP only to start — then run
#   sudo certbot --nginx -d <YOUR_DOMAIN>
# and certbot ADDS the port-443 TLS server block + the 80→443 redirect for you
# (nginx authenticator, auto-renewing — this is what avoids the manual-plugin and
# expiry problems from the Django box).
#
# Install:
#   sudo cp deploy/nginx-pc.conf /etc/nginx/sites-available/personalised-curation
#   sudo ln -s /etc/nginx/sites-available/personalised-curation /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx        # ALWAYS nginx -t first

server {
    listen 80;
    server_name YOUR_DOMAIN;   # e.g. pc-api.cultus.in

    # health check — no access log noise
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }
}
